<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label> username </label>
    <input placeholder="Enter your Name"> <br>
    <!-- Text Input -->
     <input type="text" placeholder="username"> <br>
     <input type="email" placeholder="email"> <br>
     <input type="password" placeholder="password"> <br>
     <input type="search" placeholder="Search..."> <br>
     <input type="url" placeholder="URL"> <br>
     <input type="tel" placeholder="phone"> <br>
     <!-- Range & Age -->
     <!-- Number Input -->
      <input type="number" placeholder="Age"> <br>
      <input type="number" min="18" max="100" step="1"> <br>
      <input type="range" min="0" max="100" value="30"> <br>
      <!-- Handling DOB -->
       <input type="date">
       <input type="time">

       <input type="datetime-local">
       <input type="month">
       <input type="week"> <br>

       <!-- Selection Input -->
        <input type="checkbox"> 
        <label for="agree">I agree to terms and conditions</label> <br>

        <!-- Special Input -->
         <input type="file"> <br>
         <input type="color"> <br>

         <!-- Validation Input -->
         <input type="text" required> <br>
         <!-- <input type="email" required> <br> -->
         <!-- <input type="password" required> <br> -->
          <input type="text" minLenght="3" maxLenght="10" required> <br>
          <input type="tel" pattern="[0-9] {10}" placeholder="10-digit phone number" required> <br>
          <textarea row="10" cols="15" placeholder="Feedback" required></textarea> <br>
</body>
</html>
