<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/BackendApiAddress" method="POST">
        <input type="email" placeholder="email"> <br>
        <input type="password" placeholder="password"> <br>
        <input type="text" minLenght="3" maxLenght="10" required> <br>
        <input type="tel" pattern="[0-9] {10}" placeholder="10-digit phone number"> <br>
        <input type="number" min="18" max="100" step="1"> <br>
        <button type="submit"> Submit </button>
    </form>
</body>
</html>
