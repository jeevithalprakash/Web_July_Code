<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //CALLBACK : 1. Callback is a Function and 2.Callback is PASSED as Parameter/Arguement(Inside) Into
                                                 // ANOTHER FUNCTION


          function DoHomeWork(subject, callback){
                    
              console.log(`Doing homework for ${subject}`)

              callback()  //Calling the callback function

          }       
          
          DoHomeWork("Maths", function(){
              console.log('Home Work Done ')
          })
    </script>
</body>
</html>
