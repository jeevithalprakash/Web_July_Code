<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Async - Multiple Task At Same Time

        //Task 1: Coffe -10 sec

        function Coffee(){
            console.log("Step 1 : Boil Water - 5 sec")

            setTimeout(()=>{
                    console.log("Step 2 : Water is Ready")
            },5000)  //1000 - 1sec

            console.log("Step 3 : Doing Other Task")
        }
        Coffee()

        function Greeting(){  //Task 2sec
            console.log("Good Evening Welcome Bacl")
        }
        Greeting()
    </script>
</body>
</html>
