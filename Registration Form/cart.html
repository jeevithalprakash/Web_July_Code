<!-- To make it "successfully working" dynamically, your cart page will fetch the details processed by your registration form and print out a custom success receipt. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View confirmation array for items added inside your application storage.">
    <title>Registration Cart Summary</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding: 20px; margin: 0; }
        .cart-box { background: white; max-width: 500px; margin: 50px auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 5px solid #007bff; }
        ul { list-style-type: none; padding: 0; text-align: left; }
        li { padding: 12px; border-bottom: 1px solid #eee; font-size: 16px; color: #333; }
        strong { color: #555; }
        .btn-home { display: inline-block; margin-top: 25px; padding: 12px 24px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn-home:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="cart-box">
        <div style="font-size: 50px; margin-bottom: 10px;" aria-hidden="true">✔️</div>
        <h2>Registration Successful!</h2>
        <p>Your details have been registered into the session cart:</p>
        
        <ul id="profileSummary"></ul>

        <a href="index.html" class="btn-home">Return to Home</a>
    </div>

    <script>
        window.onload = function() {
            const summaryList = document.getElementById('profileSummary');
            const data = JSON.parse(localStorage.getItem('userProfile'));

            if (!data) {
                summaryList.innerHTML = "<li>No active registration found in cart.</li>";
                return;
            }

            // Secure textual extraction strategy mapping profile items safely
            const items = [
                { label: "Registered Name", val: data.name },
                { label: "Email Handle", val: data.email },
                { label: "Enrolled Package", val: data.course },
                { label: "Gender Variant", val: data.gender }
            ];

            summaryList.innerHTML = "";
            items.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${item.label}:</strong> `;
                li.appendChild(document.createTextNode(item.val));
                summaryList.appendChild(li);
            });
        };
    </script>
</body>
</html>
