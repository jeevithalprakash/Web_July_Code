<!-- This file combines your form tags, input tags, select tags, and embedded CSS styling to make it look highly professional and modern. It includes a JavaScript function to capture the data dynamically. -->
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure registration form for creation of profile details.">
    <title>Account Registration</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .form-container { max-width: 450px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); margin: 40px auto; }
        h2 { text-align: center; color: #333; margin-top: 0; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .radio-group { margin-top: 10px; display: flex; gap: 15px; }
        .radio-item { display: flex; align-items: center; }
        .radio-item input { width: auto; margin-top: 0; margin-right: 6px; cursor: pointer; }
        .radio-item label { margin-top: 0; font-weight: normal; cursor: pointer; }
        button { width: 100%; background-color: #28a745; color: white; border: none; padding: 14px; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 25px; font-weight: bold; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Create Your Account</h2>
        
        <form id="regForm" onsubmit="saveRegistration(event)">
            
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a secure password" required>

            <label for="course">Select Course Package</label>
            <select id="course">
                <option value="Full Stack Web Dev (Basic)">Full Stack Web Dev (Basic)</option>
                <option value="Advanced JavaScript Mastery">Advanced JavaScript Mastery</option>
                <option value="UI/UX Design Frameworks">UI/UX Design Frameworks</option>
            </select>

            <label id="genderLabel">Gender</label>
            <div class="radio-group" aria-labelledby="genderLabel">
                <div class="radio-item">
                    <input type="radio" id="male" name="gender" value="Male" checked>
                    <label for="male">Male</label>
                </div>
                <div class="radio-item">
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                </div>
            </div>

            <button type="submit">Submit & View Profile</button>
        </form>
    </div>

    <script>
        function saveRegistration(event) {
            event.preventDefault();

            const name = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const course = document.getElementById('course').value;
            const gender = document.querySelector('input[name="gender"]:checked').value;

            const profileData = { name, email, course, gender };
            localStorage.setItem('userProfile', JSON.stringify(profileData));

            // Navigates directly to the cart profile breakdown file
            window.location.href = "cart.html";
        }
    </script>
</body>
</html>
