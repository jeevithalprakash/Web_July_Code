<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- link to other webpage Anchor tag helps to link to other webpages href="Address" -->
     <a href="https://www.google.com">Go to Google</a>
     <br>
     <a href="https://www.youtube.com">Go to YouTube</a>
     <br>
     <!-- website on new tab -->
     <a href="https://www.google.com" target="_blank">Go to Google (New Tab)</a>
     <br>
     <!-- connect on email -->
     <a href="mailto:example@example.com">Contact via Email</a>
     <br>
     <!-- phone number -->
     <a href="tel:+1234567890">Call Us</a>
</body>
</html>
